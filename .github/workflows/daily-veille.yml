name: Veille quotidienne

on:
  schedule:
    # 06:00 UTC = 07:00 (hiver) ou 08:00 (ete) heure de Paris
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r scripts/requirements.txt

      - name: Collecter les sources
        run: python scripts/collect.py

      - name: Curer avec Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/curate.py

      - name: Commit et push des nouvelles donnees
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Rien de nouveau a committer" || git commit -m "Veille du $(date +'%Y-%m-%d')"
          git push
